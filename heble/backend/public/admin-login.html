<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .login-container {
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      max-width: 300px;
      width: 100%;
    }
    h1 {
      text-align: center;
      color: #333;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
    }
    input {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    .button {
      display: block;
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      background-color: #007BFF;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h1>Admin Login</h1>
    <div class="form-group">
      <label for="username">Felhasználónév:</label>
      <input type="text" id="username" placeholder="Felhasználónév">
    </div>
    <div class="form-group">
      <label for="password">Jelszó:</label>
      <input type="password" id="password" placeholder="Jelszó">
    </div>
    <button class="button" onclick="login()">Bejelentkezés</button>
  </div>

  <script>
    async function login() {
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      if (!username || !password) {
        alert('Kérlek töltsd ki az összes mezőt!');
        return;
      }

      try {
        const response = await fetch('/api/admin/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ username, password }),
        });

        const data = await response.json();

        if (response.ok) {
          alert(data.message || 'Sikeres bejelentkezés!');
          window.location.href = '/'; // Redirect to admin dashboard
        } else {
          alert(data.message || 'Sikertelen bejelentkezés!');
        }
      } catch (error) {
        console.error('Hiba a bejelentkezés során:', error);
        alert('Hiba történt a bejelentkezés során.');
      }
    }
  </script>
</body>
</html>
