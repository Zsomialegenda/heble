<img src="redlights.jpg" class="img-fluid" style="width: 100%; max-height: 55vh;" alt="LED fények">

<div class="recoverlogin" style="background-color: #1f1f23; color: white; min-height: 50vh; display: flex; flex-direction: column;">

    <div>
        <h1>Fiók helyreállítás</h1>
        <hr>
        <p>Elfelejtetted a jelszavad? Van egy jó hírünk! Az <strong>emailed és biztonsági jelszó</strong> segítségével <strong>visszaállíthatod a fiókod!</strong></p>
    </div>

    <div>
        <form class="form" #recoverForm="ngForm" (ngSubmit)="submitData()">
            <div class="form-group">
              <label class="form-label">Email-cím</label><br>
              <input placeholder="Email-cím" style="color: white" [(ngModel)]="userData.email" name="email" required type="email" class="form-field" autocomplete="off">
            </div>
            <div class="form-group">
              <label class="form-label">Biztonsági jelszó</label><br>
              <input placeholder="Biztonsági jelszó" style="color: white" [(ngModel)]="userData.secureAnswer" name="secureAnswer" required type="password" class="form-field" autocomplete="off">
            </div>
            <button type="submit" class="buttonstyle" [disabled]="recoverForm.invalid">Elküldés</button>
          </form>
    </div>

    <div>
        <p>Véletlen tévedtél ide?</p>
        <a routerLink="/login" routerLinkActive="true" class="buttonstyle">Vissza a Bejelentkezéshez!</a>
    </div>
</div>
