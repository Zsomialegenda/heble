<img src="redlights.jpg" class="img-fluid" style="width: 100%; max-height: 55vh;" alt="LED fények">

<div class="login" style="background-color: #1f1f23; color: white; min-height: 50vh; display: flex; flex-direction: column;">
    <div>
        <h1>Bejelentkezés</h1>
        <hr>
        <p>Jelentkezzen be az oldalunkon, hogy elérje azokat a tartalmakat, amelyekhez <strong>kizárólagosan csak</strong> regisztrált és bejelentkezett felhasználók férhetnek hozzá!</p>
    </div>

    <div>
        <form class="form" #loginForm="ngForm" (ngSubmit)="login()">
            <div class="form-group">
                <label>Email cím</label><br>
                <input #email="ngModel" [(ngModel)]="loginUserData.email" required type="email" name="email" class="form-field"><br>
                <small style="color: red" *ngIf="email.touched && email.invalid">Helytelen Email cím!</small>
            </div>
            <div class="form-group">
                <label>Jelszó</label><br>
                <input #password="ngModel" [(ngModel)]="loginUserData.password" required type="password" name="password" class="form-field"><br>
                <small style="color: red" *ngIf="password.touched && password.invalid">Helytelen jelszó!</small>
            </div>
            <button type="submit" value="Belépés" class="buttonstyle" [disabled]="loginForm.invalid">Belépés</button>
        </form>
        
    </div>

    <div>
        <a routerLink="/signup" routerLinkActive="true" class="buttonstyle">Nincs még fiókod? Regisztrálj!</a>
    </div>
</div>
