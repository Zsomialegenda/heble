<img src="redlights.jpg" class="img-fluid" style="width: 100%; max-height: 55vh;" alt="LED fények">

<div class="changepassword">

    <div>
        <h1>Fiók helyreállítás</h1>
        <hr>
        <p>Elfelejtetted a jelszavad? Van egy jó hírünk! Az <strong>emailed és biztonsági jelszó</strong> segítségével <strong>visszaállíthatod a fiókod!</strong></p>
    </div>

    <div>
        <form class="form" #recoverForm="ngForm" (ngSubmit)="submitData()">
            <div class="form-group">
              <label class="form-label">Új jelszó</label><br>
              <input placeholder="Új jelszó" #newPassword="ngModel" [(ngModel)]="userData.newPassword" name="newPassword" required type="password" class="form-field" autocomplete="off"><br>
              <small style="color: red" *ngIf="newPassword.touched && newPassword.invalid">Helytelen jelszó!</small>
            </div>
            <button type="submit" class="buttonstyle" [disabled]="recoverForm.invalid">Elküldés</button>
          </form>
    </div>

    <div>
        <p>Véletlen tévedtél ide?</p>
        <a routerLink="/login" routerLinkActive="true" class="buttonstyle">Vissza a Bejelentkezéshez!</a>
    </div>
</div>

<!-- Bootstrap Toast értesítések: sikeres helyreállítás, valami hiba történt -->
<div class="toast-container">

    <div id="SuccessfulPasswordChange" class="toast align-items-center text-bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true">
      <div class="d-flex">
        <div class="toast-body">
          Sikeres helyreállítás!
        </div>
        <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
      </div>
    </div>

    <div id="SomethingWentWrong" class="toast align-items-center text-bg-dark border-0" role="alert" aria-live="assertive" aria-atomic="true">
      <div class="d-flex">
        <div class="toast-body">
          Valami hiba történt!
        </div>
        <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
      </div>
    </div>
    
</div>
